apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xqueries.e2e.aws-query.upbound.io
spec:
  group: e2e.aws-query.upbound.io
  # Crossplane v2 namespaced composite; the XR lives in a namespace (see the
  # E2ETest manifest). Pin explicitly rather than relying on the default.
  scope: Namespaced
  names:
    kind: XQuery
    plural: xqueries
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                region:
                  type: string
            status:
              type: object
              properties:
                # GetCallerIdentity returns a single object.
                callerIdentity:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                # DescribeRegions returns a list.
                allAvailableRegions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
