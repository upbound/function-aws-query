# Two of the cheapest query types. GetCallerIdentity needs only a valid identity;
# DescribeRegions needs only ec2:DescribeRegions. Neither reads or creates any
# account resource, so the test is deterministic and leaves nothing behind. Both
# assume the dedicated solutions-e2e-function role with the Upbound OIDC token
# (role trust: subject mcp:solutions/*:function:*, audience sts.amazonaws.com).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xqueries.e2e.aws-query.upbound.io
spec:
  compositeTypeRef:
    apiVersion: e2e.aws-query.upbound.io/v1alpha1
    kind: XQuery
  mode: Pipeline
  pipeline:
  - step: caller-identity
    functionRef:
      name: solutions-function-aws-query
    input:
      apiVersion: aws.fn.crossplane.io/v1beta1
      kind: Input
      queryType: GetCallerIdentity
      target: status.callerIdentity
      identity:
        source: WebIdentity
        webIdentity:
          roleARN: arn:aws:iam::609897127049:role/solutions-e2e-function
          tokenConfig:
            source: Filesystem
            fsPath: "/var/run/secrets/upbound.io/provider/token"
  - step: available-regions
    functionRef:
      name: solutions-function-aws-query
    input:
      apiVersion: aws.fn.crossplane.io/v1beta1
      kind: Input
      queryType: DescribeRegions
      region: eu-central-1
      target: status.allAvailableRegions
      identity:
        source: WebIdentity
        webIdentity:
          roleARN: arn:aws:iam::609897127049:role/solutions-e2e-function
          tokenConfig:
            source: Filesystem
            fsPath: "/var/run/secrets/upbound.io/provider/token"
  - step: auto-ready
    functionRef:
      name: crossplane-contrib-function-auto-ready
