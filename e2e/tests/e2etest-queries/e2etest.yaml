# End-to-end test for function-aws-query.
#
# `up test run tests/* --e2e` (run from the e2e/ project) spins up a Spaces
# control plane, installs this project (XRD + Composition) plus its function
# dependencies, applies the manifests below, and waits for defaultConditions.
#
# Credentials follow the same in-cluster method as the solutions configuration-*
# repos: no AWS secrets in CI. The function assumes the shared e2e role
# (solutions-e2e-provider-aws) via a web-identity token projected into the
# function pod by the DeploymentRuntimeConfig below, and read from fsPath by the
# composition (identity.source: WebIdentity). This mirrors the configuration e2e
# ProviderConfig with credentials.source: Upbound, which assumes the same role.
#
# ${FUNCTION_PKG} is the package built and pushed from the PR head; CI
# substitutes it before running the test (see .github/workflows/e2e.yaml).
apiVersion: meta.dev.upbound.io/v1alpha1
kind: E2ETest
metadata:
  name: e2e-aws-query
spec:
  crossplane:
    autoUpgrade:
      channel: None
  # Succeeds only if both queries ran and function-auto-ready marked the XR Ready.
  # A failed AWS call makes the function return a fatal result, the XR never goes
  # Ready, and the test fails -- which is exactly the end-to-end signal we want.
  defaultConditions:
    - Ready
  initResources:
    # Give the function pod an Upbound identity. The proidc system injects a
    # web-identity token (issuer proidc.upbound.io, subject
    # mcp:<org>/<cp>:function:function-aws-query, audience sts.amazonaws.com) and
    # mounts it, keyed off this annotation -- the same mechanism providers get via
    # credentials.source: Upbound. The composition reads the token from the proidc
    # mount (/var/run/secrets/upbound.io/provider/token); confirm the exact path on
    # the first live run, as it may differ for the function kind.
    - apiVersion: pkg.crossplane.io/v1beta1
      kind: DeploymentRuntimeConfig
      metadata:
        name: function-aws-query-e2e
      spec:
        deploymentTemplate:
          spec:
            selector: {}
            template:
              metadata:
                annotations:
                  proidc.cloud-spaces.upbound.io/identity: function.function-aws-query
              spec: {}
    # Install the function under test with the runtime config attached. Installed
    # here (not via the project's dependsOn) because dependsOn cannot set a
    # runtimeConfigRef.
    - apiVersion: pkg.crossplane.io/v1
      kind: Function
      metadata:
        name: function-aws-query
      spec:
        package: ${FUNCTION_PKG}
        runtimeConfigRef:
          name: function-aws-query-e2e
  manifests:
    - apiVersion: e2e.aws-query.upbound.io/v1alpha1
      kind: XQuery
      metadata:
        name: e2e-query
        namespace: default
      spec:
        region: eu-central-1
  skipDelete: false
  timeoutSeconds: 900
