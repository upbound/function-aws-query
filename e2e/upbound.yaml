apiVersion: meta.dev.upbound.io/v2alpha1
kind: Project
metadata:
  name: function-aws-query-e2e
spec:
  # Intentionally empty: the test installs the functions, XRD and Composition as
  # E2ETest initResources (see tests/e2etest-queries/test.yaml), not as packaged
  # dependencies. A packaged Composition would make this configuration auto-depend
  # on function-aws-query, which Crossplane can't resolve at the dev tag.
  description: |
    End-to-end test harness for function-aws-query. This is a throwaway Upbound
    project whose only purpose is to install function-aws-query on a real control
    plane (via `up test run tests/* --e2e`) and prove the function answers live
    AWS queries end to end. It is NOT published to the Marketplace.
  license: Apache-2.0
  maintainer: Upbound <support@upbound.io>
  readme: |
    See e2e/README.md.
  repository: xpkg.upbound.io/upbound/function-aws-query-e2e
