apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: function-aws-query-dynamic-refs
spec:
  compositeTypeRef:
    apiVersion: example.io/v1alpha1
    kind: XAccount
  mode: Pipeline
  pipeline:
  # Dynamic query: region, parameters, and filters all come from references
  # (here the XR spec). The same regionRef/parametersRef/filtersRef fields also
  # accept status.* (a prior step's output) and context.* (pipeline context),
  # which is how you chain multi-step dynamic queries.
  - step: ami-dynamic
    functionRef:
      name: function-aws-query
    input:
      apiVersion: aws.fn.crossplane.io/v1beta1
      kind: Input
      queryType: DescribeImages
      regionRef: spec.region
      parametersRef: spec.imageParams
      filtersRef: spec.imageFilters
      target: status.amis
    credentials:
    - name: aws-creds
      source: Secret
      secretRef:
        namespace: crossplane-system
        name: aws-creds
