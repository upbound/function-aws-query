apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: function-aws-query
spec:
  compositeTypeRef:
    apiVersion: example.io/v1alpha1
    kind: XAccount
  mode: Pipeline
  pipeline:
  # Query AWS for the list of available regions and write it onto the XR status.
  # This directly replaces a provider-terraform data-source shim (aws_regions).
  - step: available-regions
    functionRef:
      name: function-aws-query
    input:
      apiVersion: aws.fn.crossplane.io/v1beta1
      kind: Input
      queryType: DescribeRegions
      region: us-east-1
      target: status.allAvailableRegions
    credentials:
    - name: aws-creds
      source: Secret
      secretRef:
        namespace: crossplane-system
        name: aws-creds
