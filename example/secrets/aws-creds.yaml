apiVersion: v1
kind: Secret
metadata:
  name: aws-creds
  namespace: upbound-system
type: Opaque
# Byte-identical to the provider-upjet-aws Secret source: an AWS shared-credentials
# INI under the "credentials" key. Reuse your existing provider-aws secret.
#
# `crossplane render --function-credentials` reads `data` (base64), so this file
# uses base64. The decoded placeholder is:
#   [default]
#   aws_access_key_id = REPLACE_WITH_ACCESS_KEY_ID
#   aws_secret_access_key = REPLACE_WITH_SECRET_ACCESS_KEY
# Replace with your own, e.g.:
#   printf '[default]\naws_access_key_id = AKIA...\naws_secret_access_key = ...\n' | base64
