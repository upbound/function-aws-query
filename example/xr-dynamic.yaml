apiVersion: example.io/v1alpha1
kind: XAccount
metadata:
  name: example-account
spec:
  region: eu-central-1
  # The query inputs live on the XR and are pulled in via *Ref fields. In a real
  # pipeline these could instead be produced by a prior step into status/context.
  imageParams:
    owners: "099720109477"
  imageFilters:
  - name: name
    values: ["ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*"]
  - name: state
    values: ["available"]
